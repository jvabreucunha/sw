<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Partiu trilha</title></head>
<body>
<script src="timeline.js"></script>
<script>
/* Trilha e efeitos do pitch v2, sintetizados com Web Audio (OfflineAudioContext).
   buildMusic() e buildSfx() devolvem WAVs em base64 (lidos pelo mix.py). */
const SR = 48000;
const BEAT = 60 / TL.bpm, BAR = BEAT * 4;
const DROP = 22.5;                       // impacto da revelação cai num tempo forte
const GRID0 = DROP - Math.ceil(DROP / BAR) * BAR;   // começo da grade de compassos (negativo)

// gerador pseudoaleatório determinístico
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

function noiseBuf(ctx, sec = 2) {
  const b = ctx.createBuffer(1, SR * sec, SR), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1;
  return b;
}
function reverbIR(ctx, sec = 2.6, decay = 3.2) {
  const b = ctx.createBuffer(2, SR * sec, SR);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / d.length, decay); }
  return b;
}
function env(g, t, a, peak, d, sustain = 0, r = 0) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(Math.max(sustain, 0.0001), t + a + d);
  if (r) g.gain.exponentialRampToValueAtTime(0.0001, t + a + d + r);
}
function bus(ctx, out, { rev = 0, revNode } = {}) {
  const g = ctx.createGain(); g.connect(out);
  if (rev && revNode) { const s = ctx.createGain(); s.gain.value = rev; g.connect(s); s.connect(revNode); }
  return g;
}

/* ---------------- música ---------------- */
// Am9, Fmaj7, C(add9), G6: um compasso cada
const CHORDS = [
  { bass: 45, notes: [57, 60, 64, 67, 71] },
  { bass: 41, notes: [53, 57, 60, 64, 69] },
  { bass: 48, notes: [55, 60, 64, 67, 74] },
  { bass: 43, notes: [55, 59, 62, 64, 71] },
];
async function buildMusic(voice) {
  const ctx = new OfflineAudioContext(2, SR * TL.duration, SR);
  const master = ctx.createDynamicsCompressor();
  master.threshold.value = -14; master.ratio.value = 3; master.attack.value = .01; master.release.value = .2;
  master.connect(ctx.destination);
  // abaixa a música enquanto a voz fala
  const duck = ctx.createGain(); duck.connect(master);
  duck.gain.setValueAtTime(1, 0);
  for (const [k, t0] of Object.entries(TL.voice)) {
    const d = voice[k]; if (!d) continue;
    duck.gain.setTargetAtTime(.42, t0 - .15, .06);
    duck.gain.setTargetAtTime(1, t0 + d + .05, .25);
  }
  const rev = ctx.createConvolver(); rev.buffer = reverbIR(ctx); const revOut = ctx.createGain(); revOut.gain.value = .35; rev.connect(revOut); revOut.connect(duck);
  const NOISE = noiseBuf(ctx, 1);
  const S = TL.scenes;

  // filtro geral: abre conforme a energia cresce
  const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.Q.value = .5; tone.connect(duck);
  tone.frequency.setValueAtTime(1800, 0);
  tone.frequency.linearRampToValueAtTime(2500, S.chaos);
  tone.frequency.linearRampToValueAtTime(5000, S.n1);
  tone.frequency.linearRampToValueAtTime(7000, 20.3);
  tone.frequency.linearRampToValueAtTime(1200, 22.3);
  tone.frequency.setValueAtTime(16000, DROP);
  tone.frequency.setValueAtTime(16000, 50.8);
  tone.frequency.linearRampToValueAtTime(2200, 51.6);
  tone.frequency.linearRampToValueAtTime(14000, 53.5);

  const pad = bus(ctx, tone, { rev: .5, revNode: rev }); pad.gain.value = .3;
  const pluck = bus(ctx, tone, { rev: .45, revNode: rev }); pluck.gain.value = .3;
  const bassB = bus(ctx, tone); bassB.gain.value = .32;
  const drums = bus(ctx, master, { rev: .08, revNode: rev });

  for (let bar = 0; GRID0 + bar * BAR < TL.duration; bar++) {
    const t = GRID0 + bar * BAR, ch = CHORDS[((bar % 4) + 4) % 4];
    if (t + BAR < 0) continue;
    const quiet = t > 21.9 && t < DROP - .01;   // respiro antes do impacto
    // pad: osciladores levemente desafinados
    if (t < 53.4 && !quiet) for (const n of ch.notes.slice(0, 4)) for (const det of [-7, 7]) {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(n); o.detune.value = det;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
      const g = ctx.createGain(); const st = Math.max(0, t);
      const end = Math.min(t + BAR + .3, t > 20 && t < DROP ? DROP - .3 : 99);
      g.gain.setValueAtTime(0.0001, st); g.gain.linearRampToValueAtTime(.13, st + .5); g.gain.setValueAtTime(.13, end - .4); g.gain.linearRampToValueAtTime(0.0001, end);
      o.connect(f); f.connect(g); g.connect(pad); o.start(st); o.stop(end + .1);
    }
    // arpejo em colcheias (a partir do caos)
    if (t >= S.chaos - .1 && !quiet) {
      const pat = [0, 2, 1, 3, 4, 3, 2, 1];
      for (let i = 0; i < 8; i++) {
        const nt = t + i * BEAT / 2; if (nt < 0 || nt >= 56) continue;
        if (nt > 21.6 && nt < DROP) continue;
        const n = ch.notes[pat[i]] + 12;
        const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = mtof(n);
        const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = mtof(n) * 2;
        const g = ctx.createGain(); env(g, nt, .004, .5, .32); const g2 = ctx.createGain(); g2.gain.value = .25;
        o.connect(g); o2.connect(g2); g2.connect(g); g.connect(pluck); o.start(nt); o2.start(nt); o.stop(nt + .5); o2.stop(nt + .5);
      }
    }
    // baixo: semínimas a partir dos números, colcheias depois do impacto
    if (t >= S.n1 - .5 && t < 50.8 && !quiet) {
      const steps = t >= DROP ? 8 : 4;
      for (let i = 0; i < steps; i++) {
        const nt = t + i * BAR / steps; if (nt > 21.6 && nt < DROP) continue;
        const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(ch.bass + (t >= DROP && i % 2 ? 12 : 0));
        const o2 = ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = mtof(ch.bass);
        const g = ctx.createGain(); env(g, nt, .006, .9, BAR / steps * .9);
        const g2 = ctx.createGain(); g2.gain.value = .3;
        o.connect(g); o2.connect(g2); g2.connect(g); g.connect(bassB); o.start(nt); o2.start(nt); o.stop(nt + .6); o2.stop(nt + .6);
      }
    }
    // bateria
    for (let b = 0; b < 4; b++) {
      const bt = t + b * BEAT; if (bt < 0) continue;
      const full = bt >= DROP && bt < 50.8, light = bt >= S.n1 - .05 && bt < 21.6;
      const hatsOnly = bt >= S.chaos && bt < S.n1 - .05;
      if (full || light) kick(ctx, drums, bt, light ? .55 : .9);
      if (full && (b === 1 || b === 3)) clap(ctx, drums, bt, NOISE, bt >= S.app ? .5 : .38);
      if (full || light || hatsOnly) for (const off of [0, .5]) hat(ctx, drums, bt + off * BEAT, NOISE, (off ? .16 : .07) * (light ? .7 : hatsOnly ? .55 : 1));
    }
  }
  // acorde final
  for (const n of [48, 55, 60, 64, 67, 72, 76]) {
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(n);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(5000, 53.5); f.frequency.exponentialRampToValueAtTime(700, 57.8);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, 53.48); g.gain.linearRampToValueAtTime(.14, 53.55); g.gain.exponentialRampToValueAtTime(0.0001, 57.9);
    o.connect(f); f.connect(g); g.connect(pad); o.start(53.48); o.stop(58);
  }
  // fade final
  const fade = ctx.createGain();
  master.disconnect(); master.connect(fade); fade.connect(ctx.destination);
  fade.gain.setValueAtTime(0, 0); fade.gain.linearRampToValueAtTime(1, .4);
  fade.gain.setValueAtTime(1, 56.6); fade.gain.linearRampToValueAtTime(0, 57.95);
  return toWav(await ctx.startRendering());
}
function kick(ctx, out, t, v) {
  const o = ctx.createOscillator(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .12);
  const g = ctx.createGain(); env(g, t, .002, v, .35);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + .45);
}
function clap(ctx, out, t, N, v) {
  const s = ctx.createBufferSource(); s.buffer = N;
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = .8;
  const g = ctx.createGain(); env(g, t, .003, v, .18);
  s.connect(f); f.connect(g); g.connect(out); s.start(t, rnd() * .5); s.stop(t + .25);
}
function hat(ctx, out, t, N, v) {
  const s = ctx.createBufferSource(); s.buffer = N;
  const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7500;
  const g = ctx.createGain(); env(g, t, .001, v, .05);
  s.connect(f); f.connect(g); g.connect(out); s.start(t, rnd() * .5); s.stop(t + .08);
}

/* ---------------- efeitos sonoros ---------------- */
async function buildSfx() {
  const ctx = new OfflineAudioContext(2, SR * TL.duration, SR);
  const master = ctx.createDynamicsCompressor(); master.threshold.value = -10; master.ratio.value = 4; master.connect(ctx.destination);
  const rev = ctx.createConvolver(); rev.buffer = reverbIR(ctx, 3, 2.5); const ro = ctx.createGain(); ro.gain.value = .5; rev.connect(ro); ro.connect(master);
  const N = noiseBuf(ctx, 3);
  const out = bus(ctx, master, { rev: .25, revNode: rev });
  const wet = bus(ctx, master, { rev: .9, revNode: rev });
  let popN = 0, blipN = 0;
  const pan = (p) => { const s = ctx.createStereoPanner(); s.pan.value = p; return s; };
  const noise = (t, dur, offset = 0) => { const s = ctx.createBufferSource(); s.buffer = N; s.start(t, offset % 2); s.stop(t + dur); return s; };
  const tone = (type, f, t) => { const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); return o; };

  const FX = {
    whoosh(t, a, dur = .7) {
      const s = noise(t, dur, rnd()); const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
      f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(2800, t + dur * .55); f.frequency.exponentialRampToValueAtTime(700, t + dur);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(a * .9, t + dur * .5); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      const p = ctx.createStereoPanner(); p.pan.setValueAtTime(-.6, t); p.pan.linearRampToValueAtTime(.6, t + dur);
      s.connect(f); f.connect(g); g.connect(p); p.connect(out);
    },
    swoosh(t, a) { FX.whoosh(t - .15, a * 1.1, .45); },
    swipe(t, a) {
      const s = noise(t, .35, rnd()); const f = ctx.createBiquadFilter(); f.type = 'highpass';
      f.frequency.setValueAtTime(600, t); f.frequency.exponentialRampToValueAtTime(5000, t + .3);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(a * .7, t + .1); g.gain.exponentialRampToValueAtTime(0.0001, t + .35);
      const p = ctx.createStereoPanner(); p.pan.setValueAtTime(0, t); p.pan.linearRampToValueAtTime(.9, t + .35);
      s.connect(f); f.connect(g); g.connect(p); p.connect(out);
    },
    pop(t, a) {
      const f0 = [520, 620, 700, 820, 580, 760][popN++ % 6];
      const o = tone('sine', f0 * 1.8, t); o.frequency.exponentialRampToValueAtTime(f0, t + .05);
      const g = ctx.createGain(); env(g, t, .002, a * .55, .12); o.connect(g); g.connect(pan((popN % 5) / 2.5 - .8)).connect(out); o.stop(t + .2);
    },
    tap(t, a) {
      const o = tone('sine', 2200, t); o.frequency.exponentialRampToValueAtTime(900, t + .03);
      const g = ctx.createGain(); env(g, t, .001, a * .35, .05); o.connect(g); g.connect(out); o.stop(t + .08);
    },
    notif(t, a) {
      [[1318.5, 0], [1760, .11]].forEach(([f, dt]) => {
        const o = tone('sine', f, t + dt), o2 = tone('sine', f * 2.76, t + dt);
        const g = ctx.createGain(); env(g, t + dt, .003, a * .3, .7); const g2 = ctx.createGain(); g2.gain.value = .15;
        o.connect(g); o2.connect(g2); g2.connect(g); g.connect(wet); o.stop(t + dt + .9); o2.stop(t + dt + .9);
      });
    },
    blip(t, a) {
      const f = [660, 784, 988][blipN++ % 3];
      const o = tone('sine', f, t); const g = ctx.createGain(); env(g, t, .003, a * .4, .12); o.connect(g); g.connect(wet); o.stop(t + .2);
    },
    success(t, a) { [[659, 0], [988, .1], [1319, .2]].forEach(([f, dt]) => { const o = tone('sine', f, t + dt); const g = ctx.createGain(); env(g, t + dt, .003, a * .35, .45); o.connect(g); g.connect(wet); o.stop(t + dt + .6); }); },
    check(t, a) { const o = tone('sine', 1046, t); o.frequency.setValueAtTime(1568, t + .06); const g = ctx.createGain(); env(g, t, .002, a * .3, .25); o.connect(g); g.connect(wet); o.stop(t + .35); },
    suck(t, a) {
      const s = noise(t - .45, .5, rnd()); const f = ctx.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(5000, t - .45); f.frequency.exponentialRampToValueAtTime(250, t + .05);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t - .45); g.gain.exponentialRampToValueAtTime(a * .8, t); g.gain.exponentialRampToValueAtTime(0.0001, t + .06);
      s.connect(f); f.connect(g); g.connect(out);
    },
    thump(t, a) {
      const o = tone('sine', 140, t); o.frequency.exponentialRampToValueAtTime(38, t + .3);
      const g = ctx.createGain(); env(g, t, .003, a, .5); o.connect(g); g.connect(out); o.stop(t + .6);
    },
    ticks(t, dur) {
      // cliques que desaceleram junto com o contador
      const n = 26;
      for (let i = 0; i < n; i++) {
        const k = i / n, tt = t + (1 - Math.cbrt(1 - k)) * dur;
        const s = noise(tt, .012, rnd()); const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 3200 + i * 40; f.Q.value = 3;
        const g = ctx.createGain(); env(g, tt, .0005, .35, .01); s.connect(f); f.connect(g); g.connect(out);
      }
    },
    riser(t, dur) {
      const s = noise(t, dur, rnd()); const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2;
      f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(6000, t + dur);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.5, t + dur - .02); g.gain.linearRampToValueAtTime(0, t + dur);
      s.connect(f); f.connect(g); g.connect(out);
      const o = tone('sawtooth', 110, t); o.frequency.exponentialRampToValueAtTime(880, t + dur);
      const of = ctx.createBiquadFilter(); of.type = 'lowpass'; of.frequency.value = 1800;
      const og = ctx.createGain(); og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(.09, t + dur - .02); og.gain.linearRampToValueAtTime(0, t + dur);
      o.connect(of); of.connect(og); og.connect(out); o.stop(t + dur);
    },
    impact(t, a) {
      const o = tone('sine', 90, t); o.frequency.exponentialRampToValueAtTime(32, t + 1.2);
      const g = ctx.createGain(); env(g, t, .004, a, 1.6); o.connect(g); g.connect(out); o.stop(t + 1.8);
      const s = noise(t, 1.2, rnd()); const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(3000, t); f.frequency.exponentialRampToValueAtTime(200, t + .8);
      const g2 = ctx.createGain(); env(g2, t, .003, a * .5, .9); s.connect(f); f.connect(g2); g2.connect(wet);
    },
    shimmer(t, a) {
      [84, 88, 91, 96, 100].forEach((m, i) => {
        const o = tone('sine', mtof(m), t + i * .06); const g = ctx.createGain(); env(g, t + i * .06, .01, a * .09, 2.2);
        o.connect(g); g.connect(wet); o.stop(t + i * .06 + 2.4);
      });
    },
  };
  for (const [t, type, a] of TL.sfx) FX[type](t, a);
  return toWav(await ctx.startRendering());
}

/* ---------------- WAV ---------------- */
function toWav(buf) {
  const ch = buf.numberOfChannels, n = buf.length, data = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const w = (o, s) => [...s].forEach((c, i) => data.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); data.setUint32(4, 36 + n * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  data.setUint32(16, 16, true); data.setUint16(20, 1, true); data.setUint16(22, ch, true); data.setUint32(24, SR, true);
  data.setUint32(28, SR * ch * 2, true); data.setUint16(32, ch * 2, true); data.setUint16(34, 16, true); w(36, 'data'); data.setUint32(40, n * ch * 2, true);
  const chans = [...Array(ch)].map((_, c) => buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) { const v = Math.max(-1, Math.min(1, chans[c][i])); data.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true); o += 2; }
  const bytes = new Uint8Array(data.buffer); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
</script>
